# Local checks: the fast half of ci.yml. A slow hook gets bypassed with
# --no-verify, which builds the habit of skipping checks.

# The three rewriting hooks share one exclusion, defined on the first of them
# and referenced by the other two. `scripts/check_vendored.py` verifies the
# files under those paths against recorded SHA-256 digests, so no hook may
# rewrite them.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown; stripping them
        # would reflow every paragraph that uses one.
        args: [--markdown-linebreak-ext=md]
        exclude: &verified_bytes >-
          ^(cpp/third_party/|src/tfidf_stability/preprocessing/_snowball/|data/assets/|tests/fixtures/snowball/)
      - id: end-of-file-fixer
        exclude: *verified_bytes
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]          # digests are taken over LF-normalised bytes
        exclude: *verified_bytes

  # ruff runs from the environment, not from a mirror with its own `rev`, so the
  # hook and CI run the one version requirements-dev.txt pins. pre-commit does
  # not install ruff itself, so the hook needs the dev requirements installed.
  # Rationale: docs/engineering_notes.md#ruff-hook-from-environment
  - repo: local
    hooks:
      - id: ruff
        name: ruff (from requirements-dev.txt)
        # `--force-exclude` is required: pre-commit passes explicit filenames, and
        # ruff applies pyproject.toml's `extend-exclude` only to files it finds
        # itself. Without it the hook rewrites the vendored Snowball stemmer and
        # breaks the SHA-256 that `scripts/check_vendored.py` verifies.
        entry: python -m ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format (from requirements-dev.txt)
        # `--check`, not a rewrite. `ci.yml` gates on `ruff format --check`,
        # so reporting here names the file before it reaches CI without mixing
        # formatting churn into the diff being committed.
        entry: python -m ruff format --force-exclude --check
        language: system
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: vendored-digests
        name: vendored assets match their manifests
        # The provenance claims in THIRD_PARTY_NOTICES.md depend on this check,
        # so it runs at commit time as well as in CI.
        entry: python scripts/check_vendored.py
        language: system
        pass_filenames: false
        # Every directory holding a tracked MANIFEST.sha256, which is what
        # `check_vendored.py` verifies. `verified_bytes` above lists the same
        # four, from the other side: these bytes are checked, so no hook may
        # rewrite them.
        files: ^(cpp/third_party/|src/tfidf_stability/preprocessing/_snowball/|data/assets/|tests/fixtures/snowball/)

      - id: test-vacuity
        name: no test passes without asserting anything
        # Pure AST work over tests/, so it costs milliseconds and catches the
        # guard-forgotten-on-a-new-test case at the moment it is written.
        entry: python scripts/check_test_vacuity.py
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$
