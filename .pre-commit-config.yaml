# Local checks, mirroring the cheap half of ci.yml.
#
# Only the fast ones. A pre-commit hook that takes a minute gets
# bypassed with --no-verify, and a bypassed hook is worse than no hook: it
# trains the habit of skipping checks.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(cpp/third_party/|src/tfidf_stability/preprocessing/_snowball/|tests/fixtures/snowball/)
      - id: end-of-file-fixer
        exclude: ^(cpp/third_party/|src/tfidf_stability/preprocessing/_snowball/|tests/fixtures/snowball/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]          # digests are taken over LF-normalised bytes

  # ruff runs from the environment, not from a mirror pinned here.
  #
  # This used `astral-sh/ruff-pre-commit` at rev v0.7.4 while requirements-dev.txt
  # pins ruff==0.16.2, so a contributor's hook and CI enforced two different
  # linters nine minor versions apart -- and the newer one is strictly stricter.
  # That is precisely the drift the exact pin exists to prevent: ruff 0.16
  # stabilised PLR0917, which the tree had never been checked against, and the
  # lint job failed on a commit that changed no Python at all. A local hook makes
  # requirements-dev.txt the single place the version is stated.
  #
  # The cost is that `pre-commit` no longer installs ruff itself, so the hook
  # needs the dev requirements present. That is already true of every other
  # local hook here.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (from requirements-dev.txt)
        entry: python -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format (from requirements-dev.txt)
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]
        stages: [manual]          # opt-in: formatting churn obscures real diffs

  - repo: local
    hooks:
      - id: vendored-digests
        name: vendored assets match their manifests
        # The provenance claims in THIRD_PARTY_NOTICES.md depend on this, and it
        # is the one check that silently decays if left to CI alone.
        entry: python scripts/check_vendored.py
        language: system
        pass_filenames: false
        files: ^(cpp/third_party/|src/tfidf_stability/preprocessing/_snowball/|tests/fixtures/snowball/)

      - id: test-vacuity
        name: no test passes without asserting anything
        # Pure AST work over tests/, so it costs milliseconds and catches the
        # guard-forgotten-on-a-new-test case at the moment it is written.
        entry: python scripts/check_test_vacuity.py
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$
