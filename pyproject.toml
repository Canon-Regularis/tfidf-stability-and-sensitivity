[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "tfidf-stability"
version = "0.2.0"
description = "Numerical stability and perturbation behaviour in TF-IDF-based similarity systems"
readme = "README.md"
requires-python = ">=3.11"
# Code is Apache-2.0; prose and generated reports stay CC BY 4.0. LICENSE.md
# sets out the split.
license = "Apache-2.0"
# BSD-3-Clause because the wheel ships it: the vendored Snowball stemmer
# (`preprocessing/_snowball/`) and nanobind, linked into the extension.
# THIRD_PARTY_NOTICES.md holds the copyright notices that licence requires. MIT
# is absent because doctest and nanobench are build- and test-only.
license-files = [
  "LICENSES/Apache-2.0.txt",
  "LICENSES/BSD-3-Clause.txt",
  "LICENSES/CC-BY-4.0.txt",
  "LICENSE.md",
  "THIRD_PARTY_NOTICES.md",
]
authors = [{ name = "Matthew Maksymilian Miezaniec", email = "matthewmiezaniec1@gmail.com" }]
keywords = [
  "tf-idf", "information-retrieval", "cosine-similarity", "numerical-stability",
  "perturbation-analysis", "ranking-stability", "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Text Processing :: Indexing",
]

# The `reference` backend is stdlib-only: it is the normative implementation and
# has to be auditable without reading third-party code. numpy is needed only by
# the native adapter and the analysis layer.
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0", "pytest-cov>=5.0",
  "hypothesis>=6.100",
  # Exact, matching requirements-dev.txt: with a floor, `.[dev]` can install a
  # newer linter than CI runs, and a release that stabilises a rule can fail the
  # lint job on a commit that changes no Python.
  # Rationale: docs/engineering_notes.md#linters-pinned-exactly
  "ruff==0.16.2", "mypy==2.3.0",
  "scikit-learn>=1.4",          # external oracle for the differential tests
  # A test-time oracle only, never a runtime dependency: the generated stemmer
  # is vendored under preprocessing/_snowball/, and this pin is what lets CI
  # assert the vendored copy still matches upstream.
  "snowballstemmer>=3.0",
  "types-PyYAML",
  # Runs the hooks in `.pre-commit-config.yaml`, which `ci.yml` also gates on;
  # without it an install of `.[dev]` cannot run them.
  "pre-commit>=4.0",
  "reuse[charset-normalizer]>=6.0",
]
viz = ["matplotlib>=3.8", "pandas>=2.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
nb = ["jupyter>=1.0", "nbmake>=1.5", "nbformat>=5.10"]
all = ["tfidf-stability[dev,viz,docs,nb]"]

[project.scripts]
tfidf-stability = "tfidf_stability.cli.main:main"

[project.urls]
Repository = "https://github.com/Canon-Regularis/tfidf-stability-and-sensitivity"

# -----------------------------------------------------------------------------
# Build (scikit-build-core -> CMake -> nanobind)
# -----------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/tfidf_stability"]

# The stopword asset and the normative config sit at the repository root, outside
# the package directory, so `wheel.packages` alone does not ship them.
# `force-include` copies them to the packaged location the loaders try first.
# Rationale: docs/engineering_notes.md#wheel-force-include-assets
wheel.force-include = { "data/assets" = "tfidf_stability/data/assets", "configs" = "tfidf_stability/configs" }
cmake.version = ">=3.20"
cmake.build-type = "Release"
sdist.exclude = [".github", "build", "data/raw", "reports/figures"]

# `pip install . -C cmake.define.TFIDF_BUILD_NATIVE=OFF` yields a working
# reference-only install on machines with no C++ compiler.
[tool.scikit-build.cmake.define]
TFIDF_BUILD_NATIVE = "ON"
TFIDF_BUILD_TESTS = "OFF"

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The repository root, so `tooling` imports. Not `src`: `tests/conftest.py`
# adds that only when the package cannot already be imported, which is what
# lets `release.yml` test a built wheel rather than the source tree.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  # Deselected from the coverage job, so a slow test can never be the only cover
  # for a line: if it were, the 100% gate goes red and asks for a fast sibling.
  # Stress tests widen the input domain; they never introduce coverage.
  "slow: long-running; deselected from the coverage job, run by the reference and native jobs",
  "native: requires the compiled native backend",
  "sklearn: requires scikit-learn as an external oracle",
  # Applied to every @given test; check_test_vacuity.py reports an unmarked one.
  # The marker selects every property test without a hand-kept list of files.
  "property: Hypothesis property-based test",
  "differential: asserts reference/native bit-exactness",
]
filterwarnings = ["error", "ignore::DeprecationWarning:nbformat.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "examples"]
# Vendored upstream code is verified by SHA-256 against its recorded manifest,
# not by the project's style rules. Reformatting it would break that check.
extend-exclude = ["src/tfidf_stability/preprocessing/_snowball"]

[tool.ruff.lint.isort]
# `tooling` is a package at the repository root rather than under a `src`
# entry, so it is named here to sort with the package instead of with the
# third-party imports.
known-first-party = ["tfidf_stability", "tooling"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "NPY",              # numpy
  "PL",               # pylint subset
  "PT",               # pytest style
]
ignore = [
  "PLR0913",  # many arguments: the numerics APIs genuinely need explicit policies
  "PLR2004",  # magic values: unavoidable in tests asserting exact constants
  "N806",     # non-lowercase locals: mathematical names (N, V, C, L) mirror the paper
  "N803",     # ditto for arguments
  # `class X(str, Enum)` rather than `StrEnum`. Chosen because these enums are
  # serialised into YAML configs and run manifests, and the explicit `__str__`
  # on each makes the serialised form part of the visible contract rather than
  # an inherited behaviour.
  "UP042",
  # Function-level imports. In src/ they keep numpy and the compiled extension off
  # the stdlib-only reference path and keep CLI start-up from loading what a command
  # does not use. In scripts/ and tests/ they sit beside the code that needs them,
  # and keep matplotlib in make_figures.py and hypothesis in conftest.py optional.
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915"]
"notebooks/*" = ["E402"]
# Full-width and zero-width characters appear here as test data: the test
# asserts that NFKC folds them.
"tests/test_preprocessing_determinism.py" = ["RUF001", "PLE2515"]
# Structural validators read best as a sequence of guard clauses.
"src/tfidf_stability/vectorisation/sparse.py" = ["PLR0911"]
# A hand-written C++ lexer. The scanner is one state machine over a cursor,
# and every branch is a mutually exclusive thing that cursor can be sitting
# on; splitting it into helpers would hide that rather than reveal it.
"tooling/mutation_cpp.py" = ["PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src/tfidf_stability", "tooling"]
# Same reasoning as the ruff exclusion: the vendored stemmer is generated code
# whose identity is its hash. Annotating it would invalidate the manifest.
exclude = ["src/tfidf_stability/preprocessing/_snowball/"]

[[tool.mypy.overrides]]
module = ["tfidf_stability._native.*"]
# The compiled module has no stubs until Stage 3 generates them.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tfidf_stability.preprocessing._snowball.*"]
ignore_errors = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["src/tfidf_stability"]
omit = [
  # The compiled extension only. `_native/__init__.py` beside it is first-party
  # Python that chooses the backend, guards the ABI and self-tests the
  # floating-point environment, so coverage measures it.
  # Rationale: docs/engineering_notes.md#coverage-omits-only-compiled-extension
  "*/_native/_tfidf_native*",
  # Vendored Porter2, excluded from ruff and mypy because its identity is its hash
  # in MANIFEST.sha256; covering it would test snowballstemmer, not this project.
  # tests/test_preprocessing_determinism.py replays the 42,649-word official
  # conformance vectors against it.
  "*/preprocessing/_snowball/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  # A Protocol's body is a declaration, not code. One regex excludes every such
  # body, so no site needs its own pragma.
  '^\s*\.\.\.$',
]
