# The pull-request gate.

# The pure-Python reference is normative and needs no compiler, so the Python
# suite runs on every OS and supported interpreter without a toolchain. The
# native jobs are additive.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Report settings for every pytest run in this workflow. Verbosity is an `-o`
# option because each run passes -q and an added -v would cancel it. Each test
# is named as it starts, a test over 300s dumps all stacks and ends the run, and
# the slowest 25 print. Rationale: docs/engineering_notes.md#ci-pytest-report-settings
env:
  PYTEST_ADDOPTS: >-
    -o verbosity_test_cases=1
    -o faulthandler_timeout=300
    -o faulthandler_exit_on_timeout=1
    --durations=25

# bash on every runner, including Windows, where the default is pwsh.

# bash runs with `set -eo pipefail`, so a failed command aborts the step. The
# pwsh wrapper checks `$LASTEXITCODE` only at the end of a block, so a native
# command that fails mid-block does not fail the step.
# Rationale: docs/engineering_notes.md#ci-bash-default-shell
defaults:
  run:
    shell: bash

# Every job below carries `timeout-minutes`. A hang is a failure, and an untimed
# job turns it into a run cancelled hours later with no diagnosis.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          # The oldest supported interpreter, to match [tool.mypy] python_version.
          # numpy 2.5 requires 3.12 and its stubs use PEP 695 `type` statements,
          # which mypy cannot parse while targeting 3.11. Resolving on 3.11
          # installs the numpy a 3.11 user has.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # ruff and mypy are pinned in requirements-dev.txt; see the note there.
      # Installing them by name here would bypass those pins.
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      # examples/ is included: it is the first code a reader runs, and the
      # documented local gate covers it too.
      - run: python -m ruff check src tests scripts examples tooling
      - run: python -m ruff format --check src tests scripts examples tooling
      - run: python -m mypy
      - name: The two declarations of every dependency must agree
        # `pyproject.toml` is what an install of the distribution resolves and
        # `requirements*.txt` is what CI installs. This check keeps them in
        # agreement, so both give the same environment.
        run: python scripts/check_dependencies.py
      - name: Vendored assets must match their recorded digests
        # Same script pre-commit runs, so a contributor sees this locally first.
        run: python scripts/check_vendored.py
      - name: The C++ tree must mirror the Python packages
        run: python scripts/check_layout.py
      - name: Nothing may call a stdlib API newer than requires-python
        # mypy above covers src/ and tooling/ only. This asks mypy, at the
        # requires-python floor, whether tests/, scripts/ or examples/ call a
        # newer API such as `Path.read_text(newline=...)`, which exists from 3.13.
        run: python scripts/check_python_floor.py
      - name: C++ must match the style file the repository ships
        # clang-format is not on every contributor's machine, and a check that
        # skips when its tool is missing checks nothing. This enforces the subset
        # of `.clang-format` that needs no tool, reading the limits from the file.
        run: python scripts/check_cpp_format.py
      - name: No test may pass without asserting anything
        # The run-level guards elsewhere (ctest --no-tests=error, the executed-test
        # count in determinism.yml) answer "did anything run". This answers "could
        # what ran have failed", which is the same question one level down.
        run: python scripts/check_test_vacuity.py
      - name: Every allowlist entry must name the line its stamp describes
        # `docs/index.md` lists this among the local gates. A stale entry fails
        # the test suite rather than a check script, so running it here names
        # the cause directly.
        run: python -m tooling.renumber_allowlists --check
      - name: Every file must state its copyright and licence
        # LICENSE.md splits the tree between Apache-2.0 and CC-BY-4.0 in prose.
        # REUSE.toml says the same thing in a form a tool resolves, and this is
        # what stops the two drifting: a new top-level directory that neither
        # annotation covers fails here rather than shipping unlicensed.
        run: python -m reuse lint
      - name: The hooks the repository ships must still run
        # `.pre-commit-config.yaml` carries checks no workflow duplicates --
        # trailing whitespace, YAML and TOML validity, and the LF normalisation
        # that every recorded digest is taken over. Without this, all of them
        # depend on each contributor having installed the hook.
        run: python -m pre_commit run --all-files --show-diff-on-failure

  # Only on a pull request: the action compares the base ref against the head
  # ref, so on a push to main there is nothing to diff. It reads the dependency
  # graph GitHub already builds for this repository.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # A dependency carrying a known vulnerability at moderate or above
          # fails the pull request. Licences are not checked here: this
          # repository vendors and hash-verifies its third-party code, and
          # THIRD_PARTY_NOTICES.md settles the licence question.
          fail-on-severity: moderate

  reference:
    name: reference ${{ matrix.os }} py${{ matrix.python }}
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Test the normative backend
        # No compiler involved. This is the suite that defines correctness.
        run: python -m pytest tests/ -q --hypothesis-profile=ci
        env:
          HYPOTHESIS_PROFILE: ci
      - name: PYTHONHASHSEED must not reach any number
        # Dictionary ordering leaking into the vocabulary is invisible to a
        # single-process run: the seed is fixed at interpreter start-up.
        run: python -m pytest tests/ -q -k "hash_seed or determinism or reproducib"
        env:
          PYTHONHASHSEED: random
          # A step's `env:` applies to that step alone, so the profile is set
          # again here. Without it conftest.py falls back to `dev`, 50 examples
          # against 1,000, for a selection that includes property tests.
          HYPOTHESIS_PROFILE: ci

  native:
    name: native ${{ matrix.os }} py${{ matrix.python }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Pinned to a commit hash: a tag can be moved and @master cannot be
      # reproduced. An unpinned third-party action makes a CI run depend on more
      # than this repository's contents.
      # Rationale: docs/engineering_notes.md#ci-third-party-action-pins
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Build the native backend and its tests
        run: |
          cmake --preset ci
          cmake --build --preset ci
      - name: C++ unit tests
        # `--no-tests=error` and `--output-on-failure` are the test preset's,
        # set once in CMakePresets.json rather than repeated per workflow.
        run: ctest --preset ci
      - name: Install the extension
        # Build isolation stays on, as pip's default. pip builds in a clean
        # environment holding only `[build-system] requires`, as a user's install
        # does; without isolation, windows-latest cannot import scikit_build_core.
        # Rationale: docs/engineering_notes.md#ci-build-isolation
        run: python -m pip install -e .

      # Ordered before the import check, because this guard explains an import
      # failure that otherwise reports only "DLL load failed".
      - name: The extension must be self-contained (Windows)
        # A MinGW-built .pyd that depends on libwinpthread-1.dll fails to import
        # with a bare "DLL load failed", because CPython's search path does not
        # include the GCC runtime. -static prevents that.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Both preconditions are asserted: a .pyd exists and objdump is on the
          # runner. A guard that cannot run fails instead of passing.
          pyd=$(find src -name "_tfidf_native*.pyd" | head -1)
          [ -n "$pyd" ] || { echo "::error::no _tfidf_native*.pyd was built"; exit 1; }
          echo "checking $pyd"
          command -v objdump >/dev/null \
            || { echo "::error::objdump unavailable; this guard cannot run"; exit 1; }
          # Read the import table, not the file's bytes. A -static MinGW build
          # still contains the string "libgcc_s_dw2-1.dll" (the unwinder's
          # runtime LoadLibrary fallback) while importing no such DLL.
          deps=$(objdump -p "$pyd" | grep -i "DLL Name:" || true)
          # Every PE imports something (KERNEL32, pythonXY). No names at all
          # means the inspection failed rather than a clean extension.
          [ -n "$deps" ] || { echo "::error::no DLL imports read from $pyd"; exit 1; }
          echo "$deps"
          if echo "$deps" | grep -qi "libwinpthread\|libstdc++\|libgcc"; then
            echo "::error::the extension depends on a GCC runtime DLL"
            exit 1
          fi

      - name: The native backend must be importable
        # Every native test is skipif-guarded on native_available() and pytest
        # exits 0 when all of them skip, so the extension's loading is asserted.
        # The CLI owns the failure diagnosis, so the five jobs that need this
        # assertion cannot drift apart.
        run: python -m tfidf_stability.cli.main info --require-native

      - name: Run the full suite with the native backend present
        run: python -m pytest tests/ -q
        env:
          HYPOTHESIS_PROFILE: ci

  cppcheck:
    name: static analysis (C++)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install the analyser, and record which one
        # cppcheck comes from the Ubuntu archive and is not pinned. The version
        # is printed so that a finding without a code change can be attributed
        # to the analyser rather than treated as a regression.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version
      # --check-level=exhaustive is not a loosening: at the default level cppcheck
      # stops exploring branches and emits an informational note saying so, and that
      # note alone trips --error-exitcode=1. Doing what the note asks costs about 11s
      # on this tree and analyses strictly more code than the default would.
      - run: >
          cppcheck --enable=warning,performance,portability --error-exitcode=1
          --inline-suppr --std=c++20 --check-level=exhaustive
          --suppress=missingIncludeSystem
          -I cpp/include cpp/include cpp/tests

  coverage:
    name: coverage
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      # The compiled backend is installed so that native-only code is measured.
      # Tests reach the pure-Python arms by monkeypatching `native_available`.
      # Rationale: docs/engineering_notes.md#ci-coverage-native-backend
      - name: Install the extension, so every path is reachable
        run: python -m pip install -e .
      - name: The compiled backend must actually have loaded
        # Without this the job degrades silently: a failed build leaves the
        # native paths unexecuted, and the floor below reports the shortfall as a
        # coverage regression somewhere in the Python. Naming the cause here
        # costs one step and saves the misdiagnosis.
        run: python -m tfidf_stability.cli.main info --require-native
      - name: Coverage, with a floor
        # The floor is 100 on lines and branches and is never lowered; a line that
        # cannot be reached carries a pragma stating why. -m "not slow" keeps a
        # stress test from being the only cover for a line.
        # Rationale: docs/engineering_notes.md#ci-coverage-floor
        run: >
          python -m pytest tests/ -q -m "not slow"
          --cov --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-fail-under=100
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage
          path: coverage.xml

  fuzz:
    name: parser fuzzing
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: python -m pip install -e . -C cmake.define.TFIDF_BUILD_NATIVE=OFF
      - name: The .tfsx parser and the tokeniser must never leak an untyped error
        # A malformed byte, such as 0x80 inside the token block, must raise a
        # typed parser error rather than a bare UnicodeDecodeError.
        run: python -m pytest tests/test_fuzz_parsers.py -q --hypothesis-profile=ci

  notebooks:
    name: notebooks execute
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt matplotlib
      - run: python -m pip install -e . -C cmake.define.TFIDF_BUILD_NATIVE=OFF
      - name: Every notebook must run top to bottom
        # A notebook that fails to run documents an API that has moved. nbmake
        # executes each one as a test; outputs are not committed, so this is the
        # only check on them.
        run: python -m pytest --nbmake notebooks/ -q

  docs:
    name: docs links resolve
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Relative links in docs/ must point at files that exist
        # The implementation notes cross-reference the code heavily, and a stale
        # link misstates where something lives.
        run: python scripts/check_docs.py
      - name: The pipeline must still produce the digest this repository records
        # Cheap (one fixed six-document corpus) and it belongs on every PR, not
        # only on a release: this is the check that catches a change moving all
        # platforms together, which determinism.yml is blind to by construction.
        run: python scripts/snapshot.py --check
      - name: Every place that states the version must agree
        # Four files state the version, and a citation with the wrong version
        # misstates which code produced a published number. release.yml also
        # passes the tag, so a tag that disagrees with the tree cannot build.
        run: python scripts/check_versions.py

  cli:
    name: cli end to end
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Build, verify and inspect
        run: |
          python -m pip install -e . -C cmake.define.TFIDF_BUILD_NATIVE=OFF
          tfidf-stability info
          tfidf-stability build-corpus tests/fixtures/mini_corpus.jsonl -o /tmp/mini.tfsx
          tfidf-stability verify /tmp/mini.tfsx
          tfidf-stability inspect /tmp/mini.tfsx d1 > /dev/null
      - name: A generated dataset must reach a fitted model
        # The dataset layer is only useful if it feeds the pipeline, and that
        # join is not covered by unit tests on either side of it.
        run: |
          python scripts/build_corpus.py synthetic_tiny -o /tmp/synth.jsonl
          tfidf-stability build-corpus /tmp/synth.jsonl -o /tmp/synth.tfsx
          tfidf-stability verify /tmp/synth.tfsx
      - name: The synthetic corpus must be byte-identical when regenerated
        # The generator avoids random.choice/sample/shuffle because
        # they are not stable across CPython versions. This is what would catch
        # a regression that reintroduced one.
        shell: bash
        run: |
          python scripts/build_corpus.py synthetic_tiny -o /tmp/again.jsonl
          cmp /tmp/synth.jsonl /tmp/again.jsonl \
            || { echo "::error::the synthetic generator is not deterministic"; exit 1; }
      - name: The experiments must run, and section 4.4 must hold
        # run_stability_profile.py exits non-zero if any perturbation inside the
        # certified radius flipped the top-k set. That is the theorem being
        # checked against data on every push rather than asserted in a docstring.
        run: |
          python scripts/run_stability_profile.py --dataset synthetic_tiny -o /tmp/reports
          python scripts/run_tie_break_ablations.py --dataset synthetic_tiny \
            --tau 4.8e-13 -o /tmp/reports
          python scripts/run_similarity.py --dataset synthetic_tiny -o /tmp/reports
          python scripts/export_intermediates.py --dataset synthetic_tiny -o /tmp/reports
      - name: Experiment results must be reproducible from their digest
        # The result digest strips volatile fields, so a rerun on the same data
        # must produce the same string. If it does not, a published number is
        # not checkable.
        shell: bash
        run: |
          python scripts/run_stability_profile.py --dataset synthetic_tiny -o /tmp/again
          a=$(python -c "import json;print(json.load(open('/tmp/reports/stability_profile.json'))['result_digest'])")
          b=$(python -c "import json;print(json.load(open('/tmp/again/stability_profile.json'))['result_digest'])")
          [ "$a" = "$b" ] || { echo "::error::experiment result digest is not stable: $a vs $b"; exit 1; }
          echo "result digest stable: $a"
      - name: Figures must render headlessly
        run: |
          python -m pip install matplotlib
          python scripts/make_figures.py --reports /tmp/reports
      - name: MovieLens must not be fetched during CI
        # No network access here, and none wanted: the archive may not be
        # redistributed. This asserts the failure is the *documented* one rather
        # than a stack trace, since that error is a contributor's first contact
        # with the licence position.
        run: |
          python scripts/build_corpus.py movielens_small -o /tmp/ml.jsonl 2>&1 | tee /tmp/ml.log || true
          grep -q "fetch_data.py" /tmp/ml.log
      - name: A reference-only install must work without a compiler
        # `pip install . -C cmake.define.TFIDF_BUILD_NATIVE=OFF` is the documented
        # escape hatch. The first command checks that the install runs; the
        # second checks that no loadable extension was built.
        run: |
          python -m tfidf_stability.cli.main info
          if python -m tfidf_stability.cli.main info --require-native >/dev/null 2>&1; then
            echo "::error::TFIDF_BUILD_NATIVE=OFF still produced a loadable extension"
            exit 1
          fi
