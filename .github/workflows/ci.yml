# The pull-request gate.
#
# The pure-Python reference is normative and needs no compiler. So the Python
# suite runs on every OS and every supported interpreter with no toolchain, and
# the native jobs are additive. A contributor without a C++ compiler can still
# run and pass the whole normative suite.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# What every pytest invocation in this workflow reports, set once.
#
# Written as `-o` settings rather than flags because pytest derives verbosity
# from count(-v) minus count(-q), and every run here passes -q: a `-v` added
# here would cancel against it and leave the output quieter than before.
# Measured, not assumed.
#
#   verbosity_test_cases=1  names each test as it starts, so the last line of a
#                           truncated log is the test that hung. A property test
#                           hung one matrix cell for 47 minutes; the log held
#                           only progress dots, and finding the cell meant
#                           comparing job durations across nine legs.
#   faulthandler_timeout    dumps a stack trace for every thread after 300s in
#                           one test and, with exit_on_timeout, ends the run
#                           there. pytest ships this; pytest-timeout is not
#                           needed, and no dependency is added.
#   --durations=25          prints the slowest 25, so the outlier is in the log
#                           rather than reconstructed from the job list.
#
# The cap is per test, well under every job-level timeout-minutes, so it fires
# first and leaves a diagnosis behind instead of a cancelled job.
env:
  PYTEST_ADDOPTS: >-
    -o verbosity_test_cases=1
    -o faulthandler_timeout=300
    -o faulthandler_exit_on_timeout=1
    --durations=25

# bash on every runner, including Windows, where the default is pwsh.
#
# GitHub runs bash with `set -eo pipefail`, so a failed command aborts the step.
# Its pwsh wrapper sets `$ErrorActionPreference` (which governs cmdlets) and
# then checks `$LASTEXITCODE` only at the end of the block, so a native command
# failing mid-block is ignored. In the `native` job that combines badly with a
# suite whose native tests are skipif-guarded: a failed `pip install -e .`
# leaves the extension unimportable, every differential test skips, pytest exits
# 0, and the job reports green having tested nothing. Two multi-line blocks
# there were exposed.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest interpreter we support, because [tool.mypy] sets
          # python_version = "3.11" and the two have to agree. numpy 2.5
          # requires 3.12 and its stubs use PEP 695 `type` statements, which
          # mypy refuses to parse while targeting 3.11; on a 3.12 runner the job
          # then type-checks against a numpy no 3.11 user can install and dies
          # inside numpy's own .pyi. Resolving the dependencies on 3.11 gets the
          # numpy a 3.11 user has.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # ruff and mypy are pinned in requirements-dev.txt; see the note there.
      # Installing them by name here reintroduces the drift the pins stop.
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      # examples/ is included: it is the first thing a reader runs, so a broken
      # example is a worse failure than a broken internal module. The documented
      # local gate covers it; CI did not.
      - run: python -m ruff check src tests scripts examples
      - run: python -m ruff format --check src tests scripts examples
      - run: python -m mypy
      - name: Vendored assets must match their recorded digests
        # Same script pre-commit runs, so a contributor sees this locally first.
        run: python scripts/check_vendored.py
      - name: The C++ tree must mirror the Python packages
        run: python scripts/check_layout.py
      - name: No test may pass without asserting anything
        # The run-level guards elsewhere (ctest --no-tests=error, the executed-test
        # count in determinism.yml) answer "did anything run". This answers "could
        # what ran have failed", which is the same question one level down.
        run: python scripts/check_test_vacuity.py

  reference:
    name: reference ${{ matrix.os }} py${{ matrix.python }}
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Test the normative backend
        # No compiler involved. This is the suite that defines correctness.
        run: python -m pytest tests/ -q --hypothesis-profile=ci
        env:
          HYPOTHESIS_PROFILE: ci
      - name: PYTHONHASHSEED must not reach any number
        # Dictionary ordering leaking into the vocabulary is invisible to a
        # single-process run: the seed is fixed at interpreter start-up.
        run: python -m pytest tests/ -q -k "hash_seed or determinism or reproducib"
        env:
          PYTHONHASHSEED: random
          # A step's `env:` applies to that step alone. HYPOTHESIS_PROFILE was
          # set on the step above, so this one saw no profile and conftest.py
          # fell back to its default of `dev`: 50 examples against the 1,000 the
          # run above uses. The selection here is 105 tests, several of them
          # property tests, and they were being searched twenty times less hard
          # than in the preceding step, silently.
          HYPOTHESIS_PROFILE: ci

  native:
    name: native ${{ matrix.os }} py${{ matrix.python }}
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Pinned to a commit hash. A tag can be moved; @master cannot be
      # reproduced at all, and is currently ahead of the v6 release. An unpinned
      # third-party action also makes a CI run something other than a function
      # of this repository's contents, which is the one claim this project makes
      # about everything else it does. It has bitten once already: a determinism
      # run failed when the action's own download step errored.
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Build the native backend and its tests
        run: |
          cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DTFIDF_BUILD_TESTS=ON
          cmake --build build-tests
      - name: C++ unit tests
        run: ctest --test-dir build-tests --output-on-failure --no-tests=error
      - name: Install the extension
        # Build isolation ON, which is pip's default.
        #
        # This step used `--no-build-isolation`, which resolves the build
        # backend from the ambient environment. On windows-latest it could not:
        #     BackendUnavailable: Cannot import 'scikit_build_core.build'
        # Reproduced on a Windows machine where the isolated install succeeds
        # and the non-isolated one fails, with scikit-build-core installed in
        # both cases. It had been failing invisibly for a long time: the command
        # sat at the top of a multi-line block running under pwsh, which does
        # not abort mid-block, so pytest ran anyway, every native test skipped
        # on its skipif guard, and the job reported success.
        #
        # Isolation is also the more faithful test. pip builds in a clean
        # environment holding only `[build-system] requires`, which is what
        # someone installing this package gets; `--no-build-isolation`
        # exercises a configuration no user has.
        run: python -m pip install -e .

      # Ordered before the import check. This guard is the one that can explain
      # an import failure: a .pyd linked against a GCC runtime DLL fails to load
      # with a bare "DLL load failed" and nothing else. It used to run after the
      # test step, so when the import check fired the diagnosis never ran.
      - name: The extension must be self-contained (Windows)
        # A MinGW-built .pyd that depends on libwinpthread-1.dll fails to import
        # with a bare "DLL load failed", because CPython's search path does not
        # include the GCC runtime. -static prevents that.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Both preconditions are asserted rather than assumed. The previous
          # form, `command -v objdump >/dev/null && objdump -p "$pyd" | grep -q`,
          # reported success in the two cases that matter most: no .pyd built at
          # all (find matches nothing, objdump errors on the empty path, grep
          # matches nothing, step exits 0 announcing the extension is
          # self-contained), and objdump absent from the runner, which
          # short-circuits the condition to false. A guard that cannot run must
          # say so instead of passing.
          pyd=$(find src -name "_tfidf_native*.pyd" | head -1)
          [ -n "$pyd" ] || { echo "::error::no _tfidf_native*.pyd was built"; exit 1; }
          echo "checking $pyd"
          command -v objdump >/dev/null \
            || { echo "::error::objdump unavailable; this guard cannot run"; exit 1; }
          # Read the import table; a byte scan of the file gives wrong answers.
          # A -static MinGW build still contains the literal string
          # "libgcc_s_dw2-1.dll" (the unwinder's runtime LoadLibrary fallback)
          # while importing nothing of the sort, so scanning the bytes reports a
          # self-contained extension as broken. Verified against a real build.
          deps=$(objdump -p "$pyd" | grep -i "DLL Name:" || true)
          # Every PE imports something (KERNEL32, pythonXY). No names at all
          # means the inspection failed rather than a clean extension.
          [ -n "$deps" ] || { echo "::error::no DLL imports read from $pyd"; exit 1; }
          echo "$deps"
          if echo "$deps" | grep -qi "libwinpthread\|libstdc++\|libgcc"; then
            echo "::error::the extension depends on a GCC runtime DLL"
            exit 1
          fi

      - name: The native backend must be importable
        # Asserted, not hoped for. Every native test is skipif-guarded on
        # native_available(), and pytest exits 0 when all of them skip, so an
        # extension that builds but cannot load turns this job into a second run
        # of the reference suite while still reporting the native backend green.
        #
        # Diagnostic on failure rather than a bare non-zero: when this fired on
        # windows-latest there was nothing in the log to say whether the import
        # failed or the ABI disagreed, which is the whole question.
        run: |
          python - <<'PY'
          import sys, pathlib
          from tfidf_stability._native import (
              REQUIRED_ABI, build_info, native_available, unavailable_reason,
          )
          if native_available():
              print(f"native backend importable, ABI {REQUIRED_ABI}")
              print(build_info())
              sys.exit(0)
          print(f"::error::native backend not importable: {unavailable_reason() or 'unknown'}")
          print(f"expected ABI: {REQUIRED_ABI}")
          built = sorted(pathlib.Path("src").rglob("_tfidf_native*"))
          print(f"built artefacts found: {[str(p) for p in built] or 'NONE'}")
          for p in built:
              print(f"  {p}  ({p.stat().st_size} bytes)")
          try:
              import tfidf_stability._native._tfidf_native  # noqa: F401
          except Exception as exc:
              print(f"raw import error: {type(exc).__name__}: {exc}")
          sys.exit(1)
          PY

      - name: Run the full suite with the native backend present
        run: python -m pytest tests/ -q
        env:
          HYPOTHESIS_PROFILE: ci

  cppcheck:
    name: static analysis (C++)
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      # --check-level=exhaustive is not a loosening: at the default level cppcheck
      # stops exploring branches and emits an informational note saying so, and that
      # note alone trips --error-exitcode=1. Doing what the note asks costs about 11s
      # on this tree and analyses strictly more code than the default would.
      - run: >
          cppcheck --enable=warning,performance,portability --error-exitcode=1
          --inline-suppr --std=c++20 --check-level=exhaustive
          --suppress=missingIncludeSystem
          -I cpp/include cpp/include cpp/tests

  coverage:
    name: coverage
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      # The compiled backend has to be present for this job to measure what it
      # claims to. Without it `benchmarks/tfidf_perf.py` loses its 66 statements
      # of native comparison, `cli/commands.py` its build-info block and
      # `manifest.py` the arm that records a build -- code that exists, ships and
      # runs, but cannot execute on a machine with no compiler. Measuring the
      # subset that happens to be reachable and calling the result 100% would be
      # the kind of green-but-empty number this project's test suite is built to
      # refuse. The pure-Python arms stay covered because the tests reach them by
      # monkeypatching `native_available`, not by the machine lacking a compiler.
      - name: Install the extension, so every path is reachable
        run: python -m pip install -e .
      - name: The compiled backend must actually have loaded
        # Without this the job degrades silently: a failed build leaves the
        # native paths unexecuted, and the floor below reports the shortfall as a
        # coverage regression somewhere in the Python. Naming the cause here
        # costs one step and saves the misdiagnosis.
        run: |
          python - <<'CHECK'
          import sys
          from tfidf_stability._native import native_available, unavailable_reason
          sys.exit(None if native_available() else unavailable_reason())
          CHECK
      - name: Coverage, with a floor
        # A coverage number nobody gates on is decoration. The floor ratchets and
        # is never lowered to make a build pass.
        #
        # -m "not slow" is what makes the tiering honest. Because the stress tier
        # is deselected here, a slow test can never be the only cover for a line:
        # if it were, this job goes red and asks for a fast sibling. Stress tests
        # widen the input domain, they never introduce coverage. The full tier
        # runs in nightly.
        #
        # --cov-branch is explicit even though pyproject sets branch = true, so
        # the intent survives someone editing that setting.
        #
        # The floor is 100 on lines and branches both. At that setting the number
        # stops being a summary and becomes a question about every new line: it
        # is covered, or it carries a pragma naming the reason. The pragmas in
        # src/ are countable and each states why the line cannot be reached.
        run: >
          python -m pytest tests/ -q -m "not slow"
          --cov --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-fail-under=100
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  fuzz:
    name: parser fuzzing
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: python -m pip install -e . -C cmake.define.TFIDF_BUILD_NATIVE=OFF
      - name: The .tfsx parser and the tokeniser must never leak an untyped error
        # This found a real defect on its first run: one byte set to 0x80 inside
        # the token block leaked a bare UnicodeDecodeError out of the parser.
        run: python -m pytest tests/test_fuzz_parsers.py -q --hypothesis-profile=ci

  notebooks:
    name: notebooks execute
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt matplotlib
      - run: python -m pip install -e . -C cmake.define.TFIDF_BUILD_NATIVE=OFF
      - name: Every notebook must run top to bottom
        # A notebook that no longer runs is worse than no notebook: it documents
        # an API that has moved. nbmake executes them as tests; outputs are not
        # committed, so this is the only thing keeping them honest.
        run: python -m pytest --nbmake notebooks/ -q

  docs:
    name: docs links resolve
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Relative links in docs/ must point at files that exist
        # The implementation notes cross-reference the code heavily. A stale link
        # is a silent lie about where something lives.
        run: python scripts/check_docs.py
      - name: Every place that states the version must agree
        # Four files name it and nothing made them agree: pyproject.toml and
        # __init__.py said 0.2.0 while CITATION.cff still said 0.1.0. A citation
        # carrying the wrong version is a claim about which code produced a
        # published number, which is the one thing this repository asserts about
        # everything else it does.
        #
        # release.yml passes the tag as well, so a tag that disagrees with the
        # tree cannot reach the build.
        run: python scripts/check_versions.py

  cli:
    name: cli end to end
    # A hang is a failure, and an untimed job turns one into a cancelled run
    # hours later with no diagnosis. Measured: a property test that hung only
    # on windows py3.13 burned 47 minutes before anyone stopped it, while the
    # same job on every other interpreter finished in three.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Build, verify and inspect
        run: |
          python -m pip install -e . -C cmake.define.TFIDF_BUILD_NATIVE=OFF
          tfidf-stability info
          tfidf-stability build-corpus tests/fixtures/mini_corpus.jsonl -o /tmp/mini.tfsx
          tfidf-stability verify /tmp/mini.tfsx
          tfidf-stability inspect /tmp/mini.tfsx d1 > /dev/null
      - name: A generated dataset must reach a fitted model
        # The dataset layer is only useful if it feeds the pipeline, and that
        # join is not covered by unit tests on either side of it.
        run: |
          python scripts/build_corpus.py synthetic_tiny -o /tmp/synth.jsonl
          tfidf-stability build-corpus /tmp/synth.jsonl -o /tmp/synth.tfsx
          tfidf-stability verify /tmp/synth.tfsx
      - name: The synthetic corpus must be byte-identical when regenerated
        # The generator avoids random.choice/sample/shuffle because
        # they are not stable across CPython versions. This is what would catch
        # a regression that reintroduced one.
        shell: bash
        run: |
          python scripts/build_corpus.py synthetic_tiny -o /tmp/again.jsonl
          cmp /tmp/synth.jsonl /tmp/again.jsonl \
            || { echo "::error::the synthetic generator is not deterministic"; exit 1; }
      - name: The experiments must run, and section 4.4 must hold
        # run_stability_profile.py exits non-zero if any perturbation inside the
        # certified radius flipped the top-k set. That is the theorem being
        # checked against data on every push rather than asserted in a docstring.
        run: |
          python scripts/run_stability_profile.py --dataset synthetic_tiny -o /tmp/reports
          python scripts/run_tie_break_ablations.py --dataset synthetic_tiny \
            --tau 4.8e-13 -o /tmp/reports
          python scripts/run_similarity.py --dataset synthetic_tiny -o /tmp/reports
          python scripts/export_intermediates.py --dataset synthetic_tiny -o /tmp/reports
      - name: Experiment results must be reproducible from their digest
        # The result digest strips volatile fields, so a rerun on the same data
        # must produce the same string. If it does not, a published number is
        # not checkable.
        shell: bash
        run: |
          python scripts/run_stability_profile.py --dataset synthetic_tiny -o /tmp/again
          a=$(python -c "import json;print(json.load(open('/tmp/reports/stability_profile.json'))['result_digest'])")
          b=$(python -c "import json;print(json.load(open('/tmp/again/stability_profile.json'))['result_digest'])")
          [ "$a" = "$b" ] || { echo "::error::experiment result digest is not stable: $a vs $b"; exit 1; }
          echo "result digest stable: $a"
      - name: Figures must render headlessly
        run: |
          python -m pip install matplotlib
          python scripts/make_figures.py --reports /tmp/reports
      - name: MovieLens must not be fetched during CI
        # No network access here, and none wanted: the archive may not be
        # redistributed. This asserts the failure is the *documented* one rather
        # than a stack trace, since that error is a contributor's first contact
        # with the licence position.
        run: |
          python scripts/build_corpus.py movielens_small -o /tmp/ml.jsonl 2>&1 | tee /tmp/ml.log || true
          grep -q "fetch_data.py" /tmp/ml.log
      - name: A reference-only install must work without a compiler
        # `pip install . -C cmake.define.TFIDF_BUILD_NATIVE=OFF` is the
        # documented escape hatch; if it breaks, the claim that the reference
        # backend stands alone is false.
        run: python -c "from tfidf_stability._native import native_available; print('native:', native_available())"
