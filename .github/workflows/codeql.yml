# Static analysis of both implementations.

# CodeQL follows data flow across call boundaries, which the sanitizers and
# linters do not. `c-cpp` uses manual build mode with the `ci` preset, so the
# analysis sees the build CI ships, numeric flags from `NumericsFlags.cmake` included.
# Rationale: docs/engineering_notes.md#codeql-manual-build

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wednesday, away from the other scheduled work: wheels at 02:00,
    # sanitizers at 03:00 and nightly at 04:00 every day.
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: analyse ${{ matrix.language }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one rather than adding to
      # it, so `contents: read` is restated here for the checkout. The
      # escalation is `security-events: write`, for the upload to the security
      # tab.
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality rather than the default suite: this is a
          # numerics library, and the quality suite is where the comparison and
          # conversion queries live.
          queries: security-and-quality
      - if: matrix.build-mode == 'manual'
        name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - if: matrix.build-mode == 'manual'
        # The `ci` preset configures with `TFIDF_BUILD_NATIVE=ON`, and
        # `cpp/CMakeLists.txt` then requires nanobind to be importable by the
        # interpreter CMake selects. `requirements-dev.txt` carries its floor.
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - if: matrix.build-mode == 'manual'
        name: Build the core the way this project ships it
        # The `ci` preset, not autobuild, so the analysed build is configured
        # exactly as CI configures it, with the numeric flags from
        # `cpp/cmake/NumericsFlags.cmake` that every published result depends on.
        run: |
          cmake --preset ci
          cmake --build --preset ci
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:${{ matrix.language }}
