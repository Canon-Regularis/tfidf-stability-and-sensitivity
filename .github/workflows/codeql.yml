# Static analysis of both implementations.
#
# The C++ core already gets ASan, UBSan, TSan and cppcheck, and the Python side
# gets ruff and a strict mypy. All of those are either dynamic -- they report
# what a particular run did -- or single-file. CodeQL asks a different question:
# it follows data across call boundaries, which is where a use-after-free in the
# bindings or an unvalidated path reaching a file read would live.
#
# `c-cpp` needs a real build, and the manual mode below is deliberate: autobuild
# would pick its own CMake invocation, and this project's numerics depend on the
# flags `CMakePresets.json` sets. Analysing a build with different flags would
# analyse code this repository never ships.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wednesday, away from the other scheduled work: wheels at 02:00,
    # sanitizers at 03:00 and nightly at 04:00 every day.
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: analyse ${{ matrix.language }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one rather than adding to
      # it, so `contents: read` is restated here for the checkout. The
      # escalation is `security-events: write`, for the upload to the security
      # tab.
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality over the default security-extended: this is a
          # numerics library, and the quality suite is where the comparison and
          # conversion queries live.
          queries: security-and-quality
      - if: matrix.build-mode == 'manual'
        name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - if: matrix.build-mode == 'manual'
        # The `ci` preset configures with `TFIDF_BUILD_NATIVE=ON`, and
        # `cpp/CMakeLists.txt` then requires nanobind to be importable by the
        # interpreter CMake selects. `requirements-dev.txt` carries its floor.
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - if: matrix.build-mode == 'manual'
        name: Build the core the way this project ships it
        # The `ci` preset, not autobuild. `CMakePresets.json` pins the numeric
        # flags every published result depends on; a build without them is not
        # the code under analysis.
        run: |
          cmake --preset ci
          cmake --build --preset ci
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:${{ matrix.language }}
