# Wheels and a citable archive.
#
# Publishing is now straightforward because the code is Apache-2.0. Before the
# licence split it was not: the repository was CC BY 4.0 throughout, which
# Creative Commons explicitly advises against for software: no patent grant,
# and attribution terms that do not map onto compiled binaries. The prose and
# generated reports remain CC BY 4.0; see LICENSE.md.
#
# Every wheel is verified before release by running the suite against the
# INSTALLED package rather than the source tree. A wheel that builds but omits
# a data file (the stopword list, say, or the vendored stemmer) would pass
# every source-tree test and fail for the first person who installed it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. Without this every push to a branch leaves its
# predecessor running to completion against code nobody will merge, which on a
# matrix this wide is the difference between a queue that drains and one that
# does not. Scheduled runs are keyed by workflow rather than ref so a nightly
# cannot cancel a push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# See ci.yml for why these are `-o` settings and not flags: pytest derives
# verbosity from count(-v) minus count(-q), and every run here passes -q.
env:
  PYTEST_ADDOPTS: >-
    -o verbosity_test_cases=1
    -o faulthandler_timeout=300
    -o faulthandler_exit_on_timeout=1
    --durations=25

jobs:
  sdist:
    name: source distribution
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0            # setuptools-scm style version, and a full log
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --sdist
      - name: The distribution metadata must be valid before it is published
        # `twine check --strict` is what PyPI itself applies on upload, so
        # without it the first time the metadata is validated is the moment it
        # is rejected -- after the tag exists, the wheels are built and the
        # release is half-made. --strict makes a rendering warning on the long
        # description an error too, since a README that will not render is a
        # published page nobody can read.
        run: python -m twine check --strict dist/*
      - name: The sdist must build from vendored C++ sources alone
        # Renamed: the old name, "must build without network access", is not what
        # this does and cannot be. `[build-system] requires`
        # names scikit-build-core and nanobind, which come from PyPI, so a
        # `--no-index` run fails before it reaches any C++ at all. Adding that
        # flag was tried and reverted for exactly this reason.
        #
        # What the step does test is real and worth keeping: building the sdist
        # compiles the extension, and the C++ third-party sources are vendored
        # under cpp/third_party/, so a missing or unvendored C++ dependency
        # fails here. The Python build backend is a declared dependency rather than a
        # vendored one, and was never claimed otherwise.
        run: |
          python -m pip download --no-deps --no-binary :all: --dest /tmp/check dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels ${{ matrix.os }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2
        env:
          # The extension is a real CPython module, so wheels are
          # version-specific. 3.11 is the floor: the code uses `X | Y` unions and
          # `itertools.pairwise` throughout.
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_i686 *_i686 *-win32"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_BEFORE_BUILD: "pip install nanobind numpy cmake ninja"
          # Show the compiler invocation and its diagnostics. Without this the
          # only thing a failed build reports is "pip wheel ... failed with code
          # 1", which was not enough to act on.
          CIBW_BUILD_VERBOSITY: "1"
          # manylinux2014 ships GCC 10. This is a C++20 core, and the default
          # image is the usual reason a C++20 wheel builds everywhere except in
          # the manylinux container. manylinux_2_28 has GCC 12.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # libc++ needs 10.15 for the C++20 library surface; cibuildwheel
          # otherwise targets 10.9 on x86_64, where the build fails in the
          # standard headers rather than in this project's code.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # Test the INSTALLED wheel rather than the checkout.
          CIBW_TEST_REQUIRES: "pytest hypothesis scikit-learn"
          # Asserted, not printed. This read `print(..., n.native_available())`,
          # which succeeds whether the answer is True or False -- so a wheel
          # whose extension built but could not load (a missing runtime DLL is
          # the usual cause, and this matrix covers three platforms) shipped
          # green. `sys.exit(str)` exits 1 with the message, which is what makes
          # this a gate rather than a log line.
          CIBW_TEST_COMMAND: >
            python -c "import sys, tfidf_stability as t, tfidf_stability._native as n;
            print('version', t.__version__);
            sys.exit(None if n.native_available() else
            '::error::the wheel imports but its extension does not load: '
            + (n.unavailable_reason() or 'unknown'))" &&
            python -m pytest {project}/tests -q -x
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  determinism-gate:
    name: the release must be reproducible
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: A release build must not be fast-math or arch-tuned
        # The manifest refuses to stamp such a run as reproducible, so shipping
        # one would ship a binary that cannot produce publishable numbers.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from tfidf_stability.persistence.manifest import RunManifest
          m = RunManifest("release-check")
          m.require_reproducible()
          print("build is reproducible:", m.is_reproducible_build)
          PY
      - name: The pipeline digest must be the value this repository records
        # `--verbose` alone printed the digest and exited 0 whatever it said, so
        # this job asserted nothing: there was no recorded value to compare
        # against, and `determinism.yml` proves only that every platform agrees
        # with every other -- not that they agree with what was published.
        # A change moving all platforms together passed both.
        run: |
          python scripts/snapshot.py --verbose
          python scripts/snapshot.py --check

  publish:
    name: attach to the release
    needs: [sdist, wheels, determinism-gate]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write               # trusted publishing, no long-lived token
    environment: release            # requires a manual approval
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
      - run: ls -la dist/
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          files: dist/*
          generate_release_notes: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist/
