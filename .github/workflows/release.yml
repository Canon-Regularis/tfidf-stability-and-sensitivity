# Wheels and a citable archive.
#
# Publishing is now straightforward because the code is Apache-2.0. Before the
# licence split it was not: the repository was CC BY 4.0 throughout, which
# Creative Commons explicitly advises against for software: no patent grant,
# and attribution terms that do not map onto compiled binaries. The prose and
# generated reports remain CC BY 4.0; see LICENSE.md.
#
# Every wheel is verified before release by running the suite against the
# INSTALLED package rather than the source tree. A wheel that builds but omits
# a data file (the stopword list, say, or the vendored stemmer) would pass
# every source-tree test and fail for the first person who installed it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. Without this every push to a branch leaves its
# predecessor running to completion against code nobody will merge, which on a
# matrix this wide is the difference between a queue that drains and one that
# does not. Scheduled runs are keyed by workflow rather than ref so a nightly
# cannot cancel a push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# See ci.yml for why these are `-o` settings and not flags: pytest derives
# verbosity from count(-v) minus count(-q), and every run here passes -q.
env:
  PYTEST_ADDOPTS: >-
    -o verbosity_test_cases=1
    -o faulthandler_timeout=300
    -o faulthandler_exit_on_timeout=1
    --durations=25

jobs:
  sdist:
    name: source distribution
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0            # setuptools-scm style version, and a full log
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip build twine
      - name: The tag and the tree must state the same version
        # `check_versions.py` has taken a `--tag` since it was written, and its
        # own docstring says why: "`release.yml` triggers on `v*` and hands the
        # tag to nothing that checks it, so `git tag v0.3.0` on a tree declaring
        # 0.2.0 would build, test, gate and publish 0.2.0 under a 0.3.0
        # release." Nothing then passed it. The only invocation anywhere was
        # `ci.yml`, without `--tag` -- and `ci.yml` triggers on branches and
        # pull requests, not on tags, so on a release no version check ran at
        # all. The guard existed, worked, and was wired to nothing.
        #
        # Here rather than in `publish`, because `publish` needs this job and a
        # tag naming the wrong version should stop the build before any artefact
        # is made, not after three matrices have run.
        #
        # Guarded on the ref being a tag: `workflow_dispatch` runs this workflow
        # from a branch, where `github.ref_name` is "main" and the comparison
        # would be meaningless rather than informative.
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_versions.py --tag "${{ github.ref_name }}"
      - run: python -m build --sdist
      - name: The distribution metadata must be valid before it is published
        # `twine check --strict` is what PyPI itself applies on upload, so
        # without it the first time the metadata is validated is the moment it
        # is rejected -- after the tag exists, the wheels are built and the
        # release is half-made. --strict makes a rendering warning on the long
        # description an error too, since a README that will not render is a
        # published page nobody can read.
        run: python -m twine check --strict dist/*
      - name: The sdist must build from vendored C++ sources alone
        # Renamed: the old name, "must build without network access", is not what
        # this does and cannot be. `[build-system] requires`
        # names scikit-build-core and nanobind, which come from PyPI, so a
        # `--no-index` run fails before it reaches any C++ at all. Adding that
        # flag was tried and reverted for exactly this reason.
        #
        # What the step does test is real and worth keeping: building the sdist
        # compiles the extension, and the C++ third-party sources are vendored
        # under cpp/third_party/, so a missing or unvendored C++ dependency
        # fails here. The Python build backend is a declared dependency rather than a
        # vendored one, and was never claimed otherwise.
        run: |
          python -m pip download --no-deps --no-binary :all: --dest /tmp/check dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          # `publish` downloads this in the same run, so the default 90 days
          # keeps a build intermediate long after anything can read it.
          retention-days: 7

  wheels:
    # The same reusable job `wheels.yml` runs nightly and on any build-system
    # change, so the build a release performs has already been exercised.
    #
    # `needs: [sdist]` is what makes the version check above a gate. Without it
    # the matrix started alongside `sdist` and ran to completion even when the
    # tag named the wrong version -- which the comment on that check already
    # claimed it prevented.
    needs: [sdist]
    uses: ./.github/workflows/build-wheels.yml
    with:
      cibw-build: "cp311-* cp312-* cp313-*"

  determinism-gate:
    name: the release must be reproducible
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The gate inspects a wheel, so the wheels must exist first.
    needs: [wheels]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: wheels-ubuntu-latest
          path: wheelhouse
          merge-multiple: true
      - name: Install the wheel this release would ship
        # The gate below reads build flags off a compiled extension, so one must
        # be installed. Importing from `src/` finds no extension.
        run: |
          set -euo pipefail
          wheel=$(ls wheelhouse/*cp312*manylinux*x86_64*.whl 2>/dev/null | head -1)
          if [ -z "$wheel" ]; then
            echo "::error::no cp312 manylinux x86_64 wheel was produced; nothing to gate"
            ls -R wheelhouse || true
            exit 1
          fi
          echo "installing $wheel"
          python -m pip install "$wheel"
      - name: A release build must not be fast-math or arch-tuned
        # The manifest refuses to stamp such a run as reproducible, so shipping
        # one would ship a binary that cannot produce publishable numbers.
        #
        # `is_reproducible_build` is True whenever no native backend is loaded
        # (manifest.py), so the backend's presence is asserted first and the
        # flags are read off the extension.
        #
        # Run outside the checkout so the installed wheel is what is imported.
        run: |
          cd "$RUNNER_TEMP"
          python -m tfidf_stability.cli.main info --require-native
          python - <<'PY'
          from tfidf_stability._native import build_info

          info = build_info()
          print("build_info:", info)
          for key in ("fast_math", "arch_tune"):
              if info[key]:
                  raise SystemExit(f"release wheel was built with {key}={info[key]}")
          if not info["reproducible"]:
              raise SystemExit(f"wheel does not report a reproducible build: {info}")

          from tfidf_stability.persistence.manifest import RunManifest

          m = RunManifest("release-check")
          m.require_reproducible()
          print("build is reproducible:", m.is_reproducible_build)
          PY
      - name: The pipeline digest must be the value this repository records
        # `--verbose` alone printed the digest and exited 0 whatever it said, so
        # this job asserted nothing: there was no recorded value to compare
        # against, and `determinism.yml` proves only that every platform agrees
        # with every other -- not that they agree with what was published.
        # A change moving all platforms together passed both.
        run: |
          python scripts/snapshot.py --verbose
          python scripts/snapshot.py --check
      - name: Record what the wheel depends on
        # Generated from the environment the wheel was installed into, so it
        # describes the dependency closure a user actually resolves rather than
        # the floors `pyproject.toml` declares.
        #
        # What it does not cover: the vendored C++ and the Snowball stemmer are
        # compiled or copied into the wheel and are not Python distributions, so
        # no environment scan can see them. THIRD_PARTY_NOTICES.md is the record
        # for those, and `scripts/check_vendored.py` is what verifies it.
        run: |
          set -euo pipefail
          # A clean environment holding the wheel and nothing else. Scanning this
          # job's own environment would describe requirements-dev.txt -- pytest,
          # ruff, mypy and their closure -- which is not what anyone installs.
          python -m venv /tmp/sbom-env
          # Re-derived: `$wheel` was set in an earlier step, and a shell variable
          # does not survive one.
          wheel=$(ls wheelhouse/*cp312*manylinux*x86_64*.whl | head -1)
          /tmp/sbom-env/bin/python -m pip install --quiet --upgrade pip "$wheel"
          python -m pip install --quiet cyclonedx-bom
          # --output-reproducible drops the generation timestamp, so the same
          # wheel yields the same SBOM bytes.
          python -m cyclonedx_py environment /tmp/sbom-env/bin/python \
            --of JSON --output-reproducible -o sbom.cyclonedx.json
          python -c "import json; s=json.load(open('sbom.cyclonedx.json')); n=sorted(c['name'] for c in s['components']); print('CycloneDX', s['specVersion'], len(n), 'components:', ', '.join(n)); assert any(x.startswith('tfidf') for x in n), 'subject absent from its own SBOM'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 7

  # A rehearsal on TestPyPI before the upload that cannot be undone. A PyPI
  # filename is permanent: a wheel published with the wrong contents cannot be
  # replaced, only yanked and superseded by a new version. This job uploads the
  # same artefacts to an index where that does not matter, so a metadata or
  # naming fault surfaces while the version number is still reusable.
  #
  # `skip-existing` because TestPyPI rejects a filename it already holds, and a
  # re-run of a release must not fail on that alone. Every other failure here is
  # a real one and blocks `publish`.
  testpypi:
    name: rehearse on TestPyPI
    needs: [sdist, wheels, determinism-gate]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true

  publish:
    name: attach to the release
    needs: [sdist, wheels, determinism-gate, testpypi]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write               # trusted publishing, no long-lived token
      attestations: write           # build provenance for the release assets
    environment: release            # requires a manual approval
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          pattern: "{sdist,wheels-*}"
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sbom
      - name: Record what is about to be published
        # `ls` asserts nothing. These digests are what a reader compares against
        # the ones PyPI shows and against the attestation below, so the artefact
        # that was gated and the artefact that shipped can be tied together.
        run: |
          set -euo pipefail
          ls -la dist/
          sha256sum dist/* | tee dist-sha256.txt
      - name: Attest the artefacts
        # PyPI gets PEP 740 attestations from the publish step below. The files
        # attached to the GitHub release get nothing without this, so the same
        # bytes would be verifiable from one place and not the other.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          # Stated rather than left to the action's default, so a re-pin cannot
          # switch PEP 740 attestations off without a change to this line.
          attestations: true
      - name: Attach to the GitHub release
        # Last of all. Publishing a release is what triggers the Zenodo webhook,
        # and a minted DOI cannot be withdrawn, whereas a release can be deleted
        # and a failed upload retried. Ordered this way, a DOI exists only for a
        # version that reached PyPI.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: |
            dist/*
            dist-sha256.txt
            sbom.cyclonedx.json
          generate_release_notes: true
