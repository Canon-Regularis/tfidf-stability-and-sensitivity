# Check that the wheel builds, before a release depends on it.

# `release.yml` runs on a tag push. This runs the same reusable job on a
# schedule and on build-system changes, so a break shows on its own commit or
# the next morning. 02:00 avoids sanitizers (03:00) and nightly (04:00).

name: wheels

on:
  schedule:
    - cron: "0 2 * * *"
  # The C++ sources, the build backend and its configuration, the CMake files
  # and the two workflow files. A change to any of them can break the wheel
  # while every source test passes. `push` is included because most changes
  # here are direct commits to main.
  push:
    branches: [main]
    paths:
      - "cpp/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
      - ".github/workflows/build-wheels.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
      - ".github/workflows/build-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One interpreter on a push or a pull request, every supported one on the
    # schedule and on dispatch. A build-system change breaks all interpreters
    # or none, so one interpreter is enough for each commit.
    uses: ./.github/workflows/build-wheels.yml
    with:
      cibw-build: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'cp312-*' || 'cp311-* cp312-* cp313-* cp314-*' }}
      artifact-suffix: -check
      retention-days: 3
