# Deep runs, scheduled nightly rather than per pull request.
#
# The pull-request suite runs Hypothesis at 1,000 examples. This workflow runs
# 100,000 to search for a counterexample to the bounds of README section 4.

name: nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. Without this every push to a branch leaves its
# predecessor running to completion against code nobody will merge. Scheduled
# runs are keyed by workflow rather than ref so a nightly cannot cancel a push.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

# See ci.yml for why these are `-o` settings and not flags. The cap is an hour
# rather than five minutes. At 100,000 examples a single property test runs for
# many minutes, and a five-minute cap would kill it mid-search.
env:
  PYTEST_ADDOPTS: >-
    -o verbosity_test_cases=1
    -o faulthandler_timeout=3600
    -o faulthandler_exit_on_timeout=1
    --durations=25

jobs:
  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One job per module, each scoped to that module's own test file plus the
      # package surface suite. Mutation cost is (sites x suite time), so pointing
      # every module at the whole suite would turn a twenty-minute run into days.
      #
      # Scoping a module to every test that can transitively reach it reports
      # no false survivor. Such a scope does not fit this job's 90-minute cap.
      # utils/numerics.py is reachable from 27 test files, 62 sites at 210s a
      # run, so 217 minutes; vectorisation/sparse.py is 20 files, 182 minutes.
      #
      # Interpreter startup and collection take 7 to 9 seconds of every run, so
      # a narrow scope saves less than the test count suggests.
      #
      # Widening a module's scope kills mutants recorded as survivors under a
      # narrower one, and configs/equivalent_mutants.txt then fails on an entry
      # that matches no survivor. Adding a module here means running its
      # campaign and reconciling its entries first.
      #
      # tests/test_mutation_gate.py tracks the consequence: 61 of the 105
      # allowlist entries belong to the 22 modules no job here re-runs, so
      # nothing falsifies them. Its _NOT_YET_SCHEDULED set names those 22.
      #
      # Splitting also means a survivor names the module it came from without any
      # further digging.
      #
      # test_public_api_surface.py is in every entry. It pins invariants every
      # module participates in: frozen, slots, `__all__`. Without it a mutated
      # `@dataclass(frozen=True)` would survive in each module at once, and
      # sort_keys.py would leave two decorator mutants surviving.
      matrix:
        include:
          - module: src/tfidf_stability/ranking/tie_groups.py
            tests: tests/test_tie_groups_tau.py tests/test_public_api_surface.py
          - module: src/tfidf_stability/ranking/margins.py
            tests: tests/test_margins_and_flip_radii.py tests/test_public_api_surface.py
          - module: src/tfidf_stability/ranking/sort_keys.py
            tests: tests/test_ranking_tie_breaks.py tests/test_public_api_surface.py
          # 63 sites in 346s: 54 killed, 9 survivors, all in the allowlist.
          - module: src/tfidf_stability/analysis/noise_floor.py
            tests: tests/test_analysis_harness.py tests/test_public_api_surface.py
          # 72 sites: 65 killed, 7 survivors, all in the allowlist.
          - module: src/tfidf_stability/analysis/stability_profile.py
            tests: >-
              tests/test_analysis_harness.py tests/test_doc_references.py
              tests/test_public_api_surface.py
          # 51 sites: 46 killed, 5 survivors, all in the allowlist, and no
          # entry left unmatched.
          - module: src/tfidf_stability/perturbation/vector_perturb.py
            tests: >-
              tests/test_perturbation_bounds.py tests/test_perturbation_experiments.py
              tests/test_public_api_surface.py
          - module: src/tfidf_stability/perturbation/idf_perturb.py
            tests: >-
              tests/test_perturbation_bounds.py tests/test_perturbation_experiments.py
              tests/test_public_api_surface.py
          - module: src/tfidf_stability/similarity/geometry.py
            tests: >-
              tests/test_cosine_edge_cases.py tests/test_perturbation_bounds.py
              tests/test_public_api_surface.py
          - module: src/tfidf_stability/similarity/scoring.py
            tests: tests/test_scoring_kernels.py tests/test_public_api_surface.py
          - module: src/tfidf_stability/analysis/summarise.py
            tests: tests/test_analysis_harness.py tests/test_public_api_surface.py
          - module: src/tfidf_stability/ranking/distances.py
            tests: >-
              tests/test_ordering_distances.py tests/test_native_distances_differential.py
              tests/test_tie_break_ablations.py tests/test_public_api_surface.py
          - module: src/tfidf_stability/profiles/query_modes.py
            tests: >-
              tests/test_profiles_and_loo.py tests/test_query_grid_protocol.py
              tests/test_public_api_surface.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Break ${{ matrix.module }} and see whether its tests notice
        # check_test_vacuity.py proves a test can fail. Mutation testing proves
        # it fails for the right reason. Nightly rather than per-PR because the
        # cost is the suite time multiplied by the number of mutable sites.
        run: |
          python scripts/run_mutation_tests.py "${{ matrix.module }}"             --tests ${{ matrix.tests }} --timeout 180

  cpp-mutation:
    name: C++ mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One job per header, as the Python matrix has one per module. Cost is
      # (sites x suite time), and a survivor names its own header. The C++ suite
      # is a single ctest target, so every mutant is judged by the whole native
      # suite.
      #
      # Every header listed here has had its campaign triaged: each mutant that
      # scores as `survived` is argued in configs/equivalent_mutants_cpp.txt. A
      # header whose campaign has not been triaged would fail here every night
      # regardless of the state of the tests.
      #
      # tests/test_cpp_mutation_gate.py fails if a header is neither listed here
      # nor deferred in its `_NOT_YET_RECONCILED` map with a reason. That map is
      # empty: all 11 headers are scheduled.
      matrix:
        header:
          - cpp/include/tfidf/core/reduction.hpp
          - cpp/include/tfidf/core/fp_guard.hpp
          - cpp/include/tfidf/core/types.hpp
          - cpp/include/tfidf/vectorisation/sparse.hpp
          - cpp/include/tfidf/similarity/scoring.hpp
          - cpp/include/tfidf/ranking/attributes.hpp
          - cpp/include/tfidf/ranking/margins.hpp
          - cpp/include/tfidf/ranking/ranker.hpp
          - cpp/include/tfidf/ranking/sort_keys.hpp
          - cpp/include/tfidf/ranking/tie_groups.hpp
          - cpp/include/tfidf/ranking/distances.hpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Configure and prove the baseline is green
        # A tree whose tests already fail would score every mutant as killed, so
        # the campaign would report a perfect score for a broken suite.
        run: |
          cmake --preset mutation
          cmake --build --preset mutation --target tfidf_tests
          ctest --preset mutation
      - name: Break ${{ matrix.header }} and see whether the native suite notices
        # Every survivor must be argued in configs/equivalent_mutants_cpp.txt,
        # and an entry there that matches no survivor fails too -- otherwise the
        # file accretes into a blanket suppression.
        run: |
          python scripts/run_cpp_mutation_tests.py "${{ matrix.header }}"                  --build build/mutation --test-timeout 60 --json "mutants.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: cpp-mutants-${{ strategy.job-index }}
          path: mutants.json
        continue-on-error: true

  deep-property-search:
    name: hypothesis at 100k examples
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Hunt for a counterexample to any section 4 bound
        # --hypothesis-show-statistics reports, per test, how many examples were
        # generated and how many `assume()` rejected. That distinguishes the two
        # ways this step can fail (a real falsifying example, or a health check
        # such as filter_too_much) which the bare exit code does not. It is a
        # diagnostic only: nothing is suppressed, so a genuine counterexample
        # still fails the build.
        # No -q: it suppresses the statistics section entirely.
        run: >
          python -m pytest tests/test_perturbation_bounds.py
          tests/test_cosine_edge_cases.py --hypothesis-show-statistics
        env:
          HYPOTHESIS_PROFILE: nightly
      - name: Hunt for a ranking or tie-group violation
        run: |
          python -m pytest tests/test_tie_groups_tau.py tests/test_ranking_tie_breaks.py             tests/test_margins_and_flip_radii.py tests/test_ordering_distances.py -q
        env:
          HYPOTHESIS_PROFILE: nightly
      - name: Preserve any falsifying example
        # Hypothesis records counterexamples in .hypothesis/; losing one means
        # re-searching for hours to reproduce a failure already found.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: hypothesis-database
          path: .hypothesis/

  benchmarks:
    name: benchmarks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - run: |
          cmake --preset bench
          cmake --build --preset bench
      - name: Kernel microbenchmarks
        # Arch-tuned, therefore NOT reproducible: fine for timing, never for
        # results. The binary prints its own reproducible-build flag.
        run: ./build/bench/cpp/bench/tfidf_bench
      - name: Native against the reference, with bit-identity proved first
        # No test in this repository uses a pytest-benchmark fixture, so
        # `pytest --benchmark-only` would collect nothing. scripts/benchmark.py
        # does the measuring, and checks the two backends agree to the last bit
        # before printing a ratio.
        #
        # Build isolation ON, as in ci.yml and determinism.yml:
        # --no-build-isolation could not find the build backend on Windows.
        run: |
          set -euo pipefail
          python -m pip install -e .
          python scripts/benchmark.py --docs 4000 --queries 40 --repeats 9 --json bench.json
          # A ratio is only evidence if the native backend was actually there.
          # The harness degrades to reference-only rather than failing, which is
          # right for a contributor without a compiler and wrong here: it would
          # report a green benchmark job for a build that never happened.
          python -c "import json; r=json.load(open('bench.json')); c=r['comparisons']; assert c, 'the report contains no measurements'; assert r['native'], 'degraded to reference-only: ' + str(r.get('native_reason')); bad=[x['name'] for x in c if not x['verified']]; assert not bad, 'ratios reported without bit-identity: ' + str(bad); print(len(c), 'comparisons, every one bit-identity verified')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: benchmarks
          path: bench.json

  vendored-drift:
    name: vendored code vs upstream
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip snowballstemmer
      - name: The vendored stemmer must still match upstream
        # The whole justification for vendoring is that the Python and C++
        # backends run implementations generated from one source. If upstream
        # moves and the vendored copy does not, that stops being true.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import snowballstemmer
          from tfidf_stability.preprocessing.lemmatise import porter2_stem
          voc = open("tests/fixtures/snowball/voc.txt", encoding="utf-8").read().split()
          upstream = snowballstemmer.stemmer("english")
          bad = [w for w in voc if porter2_stem(w) != upstream.stemWord(w)]
          if bad:
              sys.exit(f"vendored stemmer drifted from upstream on {len(bad)} words: {bad[:5]}")
          print(f"vendored stemmer matches upstream on all {len(voc)} words")
          PY
