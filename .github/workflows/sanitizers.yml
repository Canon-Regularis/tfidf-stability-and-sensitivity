# Undefined behaviour and memory safety.
#
# Two things here are specific to this project rather than boilerplate.
#
# `float-divide-by-zero` is enabled on purpose. A division by a zero vector
# norm is a real logic error here: README section 2.3 fixes cosine to 0 for a
# zero vector, and that convention must be applied *before* the division rather
# than discovered afterwards by producing an Inf.
#
# The ranking layer is the reason ASan matters at all. A NaN in a sort key
# destroys the strict weak ordering, and libstdc++'s final insertion pass then
# walks off the front of the array: a genuine out-of-bounds write rather than
# a wrong answer. The finiteness guards exist to prevent that; ASan is what
# proves they do.

name: sanitizers

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    # The root build files are in the filter because the sanitizer option lives
    # there, not under cpp/: `TFIDF_SANITIZERS` is declared at CMakeLists.txt:42
    # and set at CMakePresets.json:56. A change that disabled or misspelled it
    # would not have run this workflow, so the sanitizers would have silently
    # stopped being applied while the job kept reporting success.
    paths:
      - "cpp/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/sanitizers.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. Without this every push to a branch leaves its
# predecessor running to completion against code nobody will merge, which on a
# matrix this wide is the difference between a queue that drains and one that
# does not. Scheduled runs are keyed by workflow rather than ref so a nightly
# cannot cancel a push.
concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: address + undefined
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy pyyaml pytest hypothesis
      - name: Build with sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja             -DCMAKE_BUILD_TYPE=RelWithDebInfo             -DTFIDF_BUILD_TESTS=ON             -DTFIDF_SANITIZERS="address;undefined"
          cmake --build build-asan
      - name: Native tests under ASan and UBSan
        # --no-tests=error carries weight here. Plain `ctest` prints
        # "No tests were found!!!" and exits **0**, so a build that registered
        # nothing (a renamed target, a dropped add_test, a CMake option that
        # quietly disabled the suite) reports a green sanitizer run having
        # executed zero tests under ASan. Measured: exit 0 without the flag,
        # exit 8 with it. Applied to every ctest call in this repository.
        run: ctest --test-dir build-asan --output-on-failure --no-tests=error
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  thread:
    name: thread
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy
      - run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo             -DTFIDF_BUILD_TESTS=ON -DTFIDF_SANITIZERS=thread
          cmake --build build-tsan
      - run: ctest --test-dir build-tsan --output-on-failure --no-tests=error

  glibcxx-assertions:
    name: libstdc++ assertions
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy
      - name: Build with hardened libstdc++
        # Catches an out-of-range container access that ASan can miss when the
        # access happens to land inside an adjacent live allocation.
        run: |
          cmake -S . -B build-assert -G Ninja -DCMAKE_BUILD_TYPE=Debug             -DTFIDF_BUILD_TESTS=ON             -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS"
          cmake --build build-assert
      - run: ctest --test-dir build-assert --output-on-failure --no-tests=error
