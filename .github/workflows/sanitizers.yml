# Undefined behaviour and memory safety.

# UBSan includes `float-divide-by-zero`: README section 2.3 sets cosine to 0
# for a zero vector before any division, so a zero-norm division is a logic
# error. ASan checks the finiteness guards that keep NaN out of sort keys.
# Rationale: docs/engineering_notes.md#sanitizer-choices

name: sanitizers

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    # The root build files are in the filter because `TFIDF_SANITIZERS` is
    # declared in CMakeLists.txt and set in CMakePresets.json. Without them, a
    # change that disables the option skips this workflow and stays green.
    paths:
      - "cpp/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/sanitizers.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A new push to a pull request cancels the run it
# supersedes. Scheduled runs use the default-branch ref, so they do not cancel
# a pull-request run.
concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: address + undefined
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy pyyaml pytest hypothesis
      - name: Build with sanitizers
        run: |
          cmake --preset asan
          cmake --build --preset asan
      - name: Native tests under ASan and UBSan
        # The `base` test preset sets `noTestsAction: error`. Plain ctest prints
        # "No tests were found!!!" and exits 0, so a build that registered no
        # tests would pass. Every ctest call in the workflows uses a preset that
        # inherits `base`, or passes --no-tests=error.
        run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  thread:
    name: thread
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy
      - run: |
          cmake --preset tsan
          cmake --build --preset tsan
      - run: ctest --preset tsan

  glibcxx-assertions:
    name: libstdc++ assertions
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy
      - name: Build with hardened libstdc++
        # Catches an out-of-range container access that ASan can miss when the
        # access happens to land inside an adjacent live allocation.
        run: |
          cmake --preset glibcxx-assertions
          cmake --build --preset glibcxx-assertions
      - run: ctest --preset glibcxx-assertions
