# The acid test.
#
# This repository claims its numbers are bit-reproducible across operating
# systems, compilers and optimisation levels. No in-process test can check that:
# a single interpreter cannot tell you what a different libm would have done.
# This workflow can, and it is the reason `spec_addenda.md#g13` exists.
#
# Before the correctly-rounded logarithm, this job would have FAILED. The
# platform `log` differs from the correctly-rounded value in about 15% of IDF
# entries, and UCRT, glibc and Apple libm each round differently, so Linux and
# Windows produced different weights, different norms and different scores. The
# fix was to compute IDF once in Python via `decimal.Decimal.ln()` and keep
# `log` out of the native core entirely, leaving only operations IEEE-754
# requires to be correctly rounded.
#
# If this job ever goes red, a published number has moved. That is the point.

name: determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. Without this every push to a branch leaves its
# predecessor running to completion against code nobody will merge, which on a
# matrix this wide is the difference between a queue that drains and one that
# does not. Scheduled runs are keyed by workflow rather than ref so a nightly
# cannot cancel a push.
concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

# See ci.yml for why these are `-o` settings and not flags: pytest derives
# verbosity from count(-v) minus count(-q), and every run here passes -q.
env:
  PYTEST_ADDOPTS: >-
    -o verbosity_test_cases=1
    -o faulthandler_timeout=300
    -o faulthandler_exit_on_timeout=1
    --durations=25

jobs:
  # --------------------------------------------------------------------------
  # The reference backend is normative and needs no compiler, so its digest must
  # agree across every OS and Python version on its own.
  # --------------------------------------------------------------------------
  reference:
    name: reference ${{ matrix.os }} py${{ matrix.python }}
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compute the pipeline digest
        id: digest
        shell: bash
        run: |
          python scripts/snapshot.py --verbose
          echo "value=$(python scripts/snapshot.py)" >> "$GITHUB_OUTPUT"
      - name: Record it
        shell: bash
        run: |
          mkdir -p digests
          printf '%s\n' "${{ steps.digest.outputs.value }}" \
            > "digests/reference-${{ matrix.os }}-py${{ matrix.python }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-reference-${{ matrix.os }}-py${{ matrix.python }}
          path: digests/

  # --------------------------------------------------------------------------
  # The native backend, built three ways. -O0 and -O3 exercise completely
  # different instruction selection and vectorisation, so agreeing at both is a
  # much stronger statement than agreeing at the default.
  # --------------------------------------------------------------------------
  native:
    name: native ${{ matrix.os }} ${{ matrix.build }}
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build: [Debug, Release, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install build dependencies
        # The full dev set rather than a hand-picked subset: the suite needs pytest,
        # hypothesis, numpy and pyyaml, and a hand-picked trio kept omitting
        # one. The build backend is no longer resolved from here (the install
        # step below uses pip's build isolation), but the test dependencies
        # still are, so this stays.
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      # Ninja must be on PATH before `cmake -G Ninja` runs. Having the configure
      # step above this one failed every native job on every OS.
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - name: Configure
        run: >
          cmake -S . -B build-tests -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DTFIDF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-tests
      - name: Native unit tests
        run: ctest --test-dir build-tests --output-on-failure --no-tests=error
      # The native backend must not change any number. The digest here is
      # computed by the reference path, and the differential suite is what
      # proves the two agree, so a divergence shows up as a test failure with
      # a precise location rather than as an opaque hash mismatch.
      - name: Differential suite (reference vs native, bit-exact)
        shell: bash
        run: |
          # Build isolation ON, as in ci.yml: `--no-build-isolation` could not
          # find the build backend on windows-latest
          # (BackendUnavailable: Cannot import 'scikit_build_core.build') and
          # the failure was masked by pwsh not aborting mid-block.
          python -m pip install -e .
          # The backend must be *importable*, asserted before the suite runs.
          # Every differential test is skipif-guarded on native_available(), and
          # pytest exits 0 when every selected test skips. Measured: "2
          # skipped", exit 0. So a .pyd that built but failed to load (a missing
          # runtime DLL is the usual cause, and this job builds on three
          # platforms) would skip the entire comparison and report the native
          # backend bit-identical to the reference having compared nothing.
          python - <<'PY'
          import sys
          from tfidf_stability._native import native_available, unavailable_reason
          if not native_available():
              sys.exit(f"::error::native backend not importable: {unavailable_reason() or 'unknown'}")
          print("native backend importable; the differential suite will not skip")
          PY
          python -m pytest tests/ -q -m "differential or native" --junitxml=diff.xml
          # Belt and braces: even with the backend present, a marker rename or a
          # collection error could select nothing. Require real executions.
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("diff.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"differential tests: {total} selected, {skipped} skipped, {ran} executed")
          if ran < 20:
              sys.exit(f"::error::only {ran} differential tests executed; expected the full suite")
          PY
      - name: Compute the pipeline digest
        id: digest
        shell: bash
        run: echo "value=$(python scripts/snapshot.py)" >> "$GITHUB_OUTPUT"
      - name: Record it
        shell: bash
        run: |
          mkdir -p digests
          printf '%s\n' "${{ steps.digest.outputs.value }}" \
            > "digests/native-${{ matrix.os }}-${{ matrix.build }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-native-${{ matrix.os }}-${{ matrix.build }}
          path: digests/

  # --------------------------------------------------------------------------
  # The comparison. Every digest from every job must be the same string.
  # --------------------------------------------------------------------------
  compare:
    name: all digests must be identical
    needs: [reference, native]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: collected
          pattern: digest-*
          merge-multiple: true
      - name: Compare
        shell: bash
        run: |
          echo "Collected digests:"
          for f in collected/*.txt; do
            printf '  %-46s %s\n' "$(basename "$f" .txt)" "$(cat "$f")"
          done

          # A cross-platform claim needs more than one platform. `unique -ne 1`
          # is satisfied by a single collected digest, so if every matrix job
          # but one failed to upload, this would report "all digests identical"
          # having compared a value with itself.
          # 18, not 6. The reference matrix is 3 OS x 3 interpreters and the
          # native matrix 3 OS x 3 build types, and every leg uploads one digest.
          # At a threshold of 6, twelve legs could fail to upload and the
          # comparison would still pass on whatever survived -- which is the
          # same failure the paragraph above describes, one level out.
          expected=18
          collected=$(ls collected/*.txt | wc -l)
          if [ "$collected" -ne "$expected" ]; then
            echo "::error::collected $collected digests, expected $expected (one per matrix leg)"
            ls collected/*.txt
            exit 1
          fi
          # `sort -u collected/*.txt`, never `cat ... | sort -u`. Each digest file
          # holds one line, and a file written without a trailing newline runs
          # into its neighbour under `cat`: three files holding AAA, AAA and BBB
          # concatenate to the single line AAABBBAAA, which sorts to one unique
          # value. `unique` was therefore always 1, and this gate -- the
          # project's flagship reproducibility claim -- could not fail. Verified
          # by construction before fixing it.
          #
          # `sort` reads each path as its own input and terminates the final line
          # itself, so this stays correct even if a writer regresses.
          unique=$(sort -u collected/*.txt | wc -l)
          if [ "$unique" -ne 1 ]; then
            echo
            echo "::error::the pipeline digest is NOT identical across builds"
            echo "A published number has moved. Run 'python scripts/snapshot.py --verbose'"
            echo "on the differing platforms to see which stage diverged:"
            echo "  idf only          -> the logarithm (see spec_addenda G13)"
            echo "  weights onwards   -> the vectoriser"
            echo "  scores only       -> the reduction policy or the scoring kernel"
            exit 1
          fi
          echo
          echo "All $(ls collected/*.txt | wc -l) builds agree: $(head -1 collected/*.txt | head -1)"

  # --------------------------------------------------------------------------
  # A guard that only matters when it fires: the numeric guard rails must
  # actually reject an unsound build, or their passing means nothing.
  # --------------------------------------------------------------------------
  guards-reject-unsound-builds:
    name: fast-math must fail to compile
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy
      - name: A fast-math build must be refused
        run: |
          cmake -S . -B build-fastmath -G Ninja -DTFIDF_FAST_MATH=ON -DTFIDF_BUILD_TESTS=ON
          # Both streams: ninja buffers compiler output and re-emits it on
          # STDOUT, so capturing stderr alone yields an empty log and the grep
          # below can never match, which is how this job failed.
          if cmake --build build-fastmath >build.log 2>&1; then
            echo "::error::a fast-math build compiled; the fp_guard.hpp guard is not working"
            exit 1
          fi
          grep -q "ffast-math" build.log \
            || { echo "::error::the build failed for the wrong reason"; cat build.log; exit 1; }
          echo "The compile-time guard rejected the build, as intended."
