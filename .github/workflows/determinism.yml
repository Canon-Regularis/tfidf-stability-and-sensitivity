# Cross-platform bit-reproducibility.

# The pipeline digest must be identical across operating systems, compilers
# and optimisation levels, which one interpreter cannot check. A red run
# means a published number has moved. See `spec_addenda.md#g13`.
# Rationale: docs/engineering_notes.md#cross-platform-digest

name: determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A newer run for the same ref cancels the one in
# progress, so a superseded commit does not hold runners for the full matrix.
concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

# See ci.yml for why these are `-o` settings and not flags: pytest derives
# verbosity from count(-v) minus count(-q), and every run here passes -q.
env:
  PYTEST_ADDOPTS: >-
    -o verbosity_test_cases=1
    -o faulthandler_timeout=300
    -o faulthandler_exit_on_timeout=1
    --durations=25

jobs:
  # --------------------------------------------------------------------------
  # The reference backend is normative and needs no compiler, so its digest must
  # agree across every OS and Python version on its own.
  # --------------------------------------------------------------------------
  reference:
    name: reference ${{ matrix.os }} py${{ matrix.python }}
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compute the pipeline digest
        id: digest
        shell: bash
        run: |
          python scripts/snapshot.py --verbose
          echo "value=$(python scripts/snapshot.py)" >> "$GITHUB_OUTPUT"
      - name: Record it
        shell: bash
        run: |
          mkdir -p digests
          printf '%s\n' "${{ steps.digest.outputs.value }}" \
            > "digests/reference-${{ matrix.os }}-py${{ matrix.python }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: digest-reference-${{ matrix.os }}-py${{ matrix.python }}
          path: digests/

  # --------------------------------------------------------------------------
  # The native backend at three build types. -O0 and -O3 differ in instruction
  # selection and vectorisation, so agreement at both is the stronger result.
  # --------------------------------------------------------------------------
  native:
    name: native ${{ matrix.os }} ${{ matrix.build }}
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build: [Debug, Release, RelWithDebInfo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install build dependencies
        # The full dev set, since the suite needs pytest, hypothesis, numpy and
        # pyyaml. The build backend comes from pip's build isolation in the
        # install step below.
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      # Ninja must be on PATH before `cmake -G Ninja` runs, so this step comes
      # before Configure.
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - name: Configure
        # The one build here that is not a preset. This matrix is parameterised
        # over CMAKE_BUILD_TYPE and a preset is a name rather than a parameter,
        # so the flags are spelled out and TFIDF_WERROR is set to match what
        # every preset inherits from `base`.
        timeout-minutes: 5
        run: >
          cmake -S . -B build-tests -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DTFIDF_BUILD_TESTS=ON
          -DTFIDF_WERROR=ON
      - name: Build
        timeout-minutes: 12
        run: cmake --build build-tests
      # ctest carries its own 300s TIMEOUT property on cpp.unit, so this bounds
      # the step around it rather than the test.
      - name: Native unit tests
        timeout-minutes: 10
        run: ctest --test-dir build-tests --output-on-failure --no-tests=error
      # The native backend must not change any number. The digest here is
      # computed by the reference path, and the differential suite is what
      # proves the two agree, so a divergence shows up as a test failure with
      # a precise location rather than as an opaque hash mismatch.
      - name: Differential suite (reference vs native, bit-exact)
        # A job-level limit cannot name the step that hung, and a cancelled job
        # keeps no log, so every long step here has its own bound.
        timeout-minutes: 12
        shell: bash
        run: |
          # Build isolation on, as in ci.yml: `--no-build-isolation` does not
          # find scikit_build_core on windows-latest. The step uses bash, which
          # stops at the first failing command; pwsh carries on past one.
          python -m pip install -e .
          # Every differential test skips without native_available(), and pytest
          # exits 0 when all tests skip, so an extension that built but does not
          # load would pass. The backend is required to import first.
          # Rationale: docs/engineering_notes.md#differential-requires-native
          python -m tfidf_stability.cli.main info --require-native
          python -m pytest tests/ -q -m "differential or native" --junitxml=diff.xml
          # With the backend present, a marker rename or a collection error can
          # still select nothing, so a minimum number of executed tests is required.
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("diff.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"differential tests: {total} selected, {skipped} skipped, {ran} executed")
          if ran < 20:
              sys.exit(f"::error::only {ran} differential tests executed; expected the full suite")
          PY
      - name: Compute the pipeline digest
        id: digest
        shell: bash
        run: echo "value=$(python scripts/snapshot.py)" >> "$GITHUB_OUTPUT"
      - name: Record it
        shell: bash
        run: |
          mkdir -p digests
          printf '%s\n' "${{ steps.digest.outputs.value }}" \
            > "digests/native-${{ matrix.os }}-${{ matrix.build }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: digest-native-${{ matrix.os }}-${{ matrix.build }}
          path: digests/

  # --------------------------------------------------------------------------
  # The comparison. Every digest from every job must be the same string.
  # --------------------------------------------------------------------------
  compare:
    name: all digests must be identical
    needs: [reference, native]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: collected
          pattern: digest-*
          merge-multiple: true
      - name: Compare
        shell: bash
        run: |
          echo "Collected digests:"
          for f in collected/*.txt; do
            printf '  %-46s %s\n' "$(basename "$f" .txt)" "$(cat "$f")"
          done

          # One digest per matrix leg: 3 OS x 3 interpreters for the reference
          # and 3 OS x 3 build types for native. A single digest satisfies the
          # uniqueness check below, so every leg must have uploaded one.
          expected=18
          collected=$(ls collected/*.txt | wc -l)
          if [ "$collected" -ne "$expected" ]; then
            echo "::error::collected $collected digests, expected $expected (one per matrix leg)"
            ls collected/*.txt
            exit 1
          fi
          # `sort -u collected/*.txt`, not `cat ... | sort -u`: `cat` joins a file
          # that lacks a trailing newline to the next one, so differing digests
          # can merge into one line. `sort` ends each file's last line itself.
          # Rationale: docs/engineering_notes.md#digest-compare-sort-not-cat
          unique=$(sort -u collected/*.txt | wc -l)
          if [ "$unique" -ne 1 ]; then
            echo
            echo "::error::the pipeline digest is NOT identical across builds"
            echo "A published number has moved. Run 'python scripts/snapshot.py --verbose'"
            echo "on the differing platforms to see which stage diverged:"
            echo "  idf only          -> the logarithm (see spec_addenda G13)"
            echo "  weights onwards   -> the vectoriser"
            echo "  scores only       -> the reduction policy or the scoring kernel"
            exit 1
          fi
          echo
          echo "All $(ls collected/*.txt | wc -l) builds agree: $(head -1 collected/*.txt | head -1)"

  # --------------------------------------------------------------------------
  # The compile-time guard in fp_guard.hpp must reject a fast-math build, and
  # the build must fail for that reason.
  # --------------------------------------------------------------------------
  guards-reject-unsound-builds:
    name: fast-math must fail to compile
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip nanobind numpy
      - name: A fast-math build must be refused
        run: |
          cmake --preset fastmath-guard-check
          # Both streams: ninja re-emits compiler output on stdout, so a log of
          # stderr alone is empty and the grep below cannot match. The grep names
          # the guard's message: ninja prints each failed command in full, and the
          # bare -ffast-math would match the command of any failed tfidf compile.
          if cmake --build --preset fastmath-guard-check >build.log 2>&1; then
            echo "::error::a fast-math build compiled; the fp_guard.hpp guard is not working"
            exit 1
          fi
          grep -q "tfidf: built with -ffast-math" build.log \
            || { echo "::error::the build failed for the wrong reason"; cat build.log; exit 1; }
          echo "The compile-time guard rejected the build, as intended."
