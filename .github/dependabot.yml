# Automated update proposals for GitHub Actions.

# Each external `uses:` is pinned to a full commit SHA with its tag as a
# trailing comment, and Dependabot updates both halves. Python packages are not watched
# by version; security advisories arrive as Dependabot alerts.
# Rationale: docs/engineering_notes.md#dependabot-scope

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One pull request carries every action bump. The updates are mostly
    # mechanical, and one review covers them together.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    open-pull-requests-limit: 3
